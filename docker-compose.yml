services:
  mysql:
    image: mysql:8.0
    container_name: simplenotes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: notes_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./SimpleNotesAPI
    container_name: simplenotes-api
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: notes_db
      TEST_DB_HOST: mysql
      TEST_DB_PORT: 3306
      TEST_DB_USER: appuser
      TEST_DB_PASSWORD: apppassword
      TEST_DB_NAME: notes_db_test
    ports:
      - "3001:3001"

  ui:
    build:
      context: ./SimpleNotesUI
    container_name: simplenotes-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"

volumes:
  mysql_data:
