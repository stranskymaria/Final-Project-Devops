services:
  mysql:
    image: mysql:8.0
    container_name: simplenotes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notes_db}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./SimpleNotesAPI
    container_name: simplenotes-api
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - ${API_ENV_FILE:-./SimpleNotesAPI/.env}
    environment:
      PORT: ${API_PORT:-3001}
      DB_HOST: mysql
      DB_PORT: 3306
      TEST_DB_HOST: mysql
      TEST_DB_PORT: 3306
    ports:
      - "${API_PORT:-3001}:3001"

  ui:
    build:
      context: ./SimpleNotesUI
    container_name: simplenotes-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "${UI_PORT:-5173}:5173"

volumes:
  mysql_data:
