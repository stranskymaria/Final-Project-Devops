services:
  api:
    image: ${API_IMAGE}
    container_name: simplenotes-prod-green-api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-3001}
      APP_BUILD_SHA: ${APP_BUILD_SHA:-}
      APP_DEPLOY_COLOR: green
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-notes_db}
      TEST_DB_HOST: ${DB_HOST}
      TEST_DB_PORT: ${DB_PORT:-3306}
      TEST_DB_USER: ${DB_USER}
      TEST_DB_PASSWORD: ${DB_PASSWORD}
      TEST_DB_NAME: ${DB_NAME:-notes_db}
    ports:
      - "${API_PORT:-3001}:3001"

  ui:
    image: ${UI_IMAGE}
    container_name: simplenotes-prod-green-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_BUILD_SHA: ${APP_BUILD_SHA:-}
      APP_DEPLOY_COLOR: green
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${UI_PORT:-5173}:5173"
